<!-- Chatbot Element -->
<div id="chatbot-container">
  <!-- Chatbot Toggler -->
  <button id="chatbot-toggler">
    <span class="material-symbols-rounded toggler-icon-chat">Chat</span>
    <span class="material-symbols-rounded toggler-icon-close">close</span>
    <span id="togglerPresenceDot" class="toggler-presence-dot" style="display:none;"></span>
    <span id="togglerUnreadBadge" class="toggler-unread-badge" style="display:none;"></span>
  </button>
  <div class="chatbot-popup">
    <!-- Chatbot Header -->
    <div class="chat-header">
      <div class="header-info">
        <img class="chatbot-logo" src="./image/branding/favicon.webp" alt="Veronica" width="50" height="50">
        <div>
          <h2 class="logo-text">Veronica</h2>
          <div id="agentStatusLine" class="agent-status-line" style="display:none;">
            <span class="agent-status-dot"></span><span id="agentStatusText"></span>
          </div>
        </div>
      </div>
      <div class="chat-header-actions">
        <button id="threads-toggler" class="material-symbols-rounded" title="Conversation history">history</button>
        <button id="close-chatbot" class="material-symbols-rounded">keyboard_arrow_down</button>
      </div>
    </div>

    <!-- Conversation Threads Panel -->
    <div id="threads-panel" class="threads-panel" style="display:none;">
      <div class="threads-panel-header">
        <span>Your Conversations</span>
        <button id="new-conversation-btn" type="button" class="new-conv-btn">+ New</button>
      </div>
      <div id="threads-list" class="threads-list"></div>
    </div>

    <!-- User Info Form (shown initially) -->
    <div id="user-info-form" class="user-info-form">
      <div class="form-header">
        <h3>Welcome to Sentra!</h3>
        <p>Please provide your details to get started.</p>
      </div>
      <form id="info-form" class="info-form">
        <div class="form-group">
          <input type="text" id="user-name" placeholder="Your Name" required>
          <div class="error-message" id="name-error"></div>
        </div>
        <div class="form-group">
          <input type="email" id="user-email" placeholder="Business Email" required>
          <div class="error-message" id="email-error"></div>
        </div>
        <button type="submit" id="submit-info" class="submit-btn">Start Chat</button>
      </form>
    </div>

    <!-- Chatbot Body (shown after form submission) -->
    <div class="chat-body" id="chat-body" style="display: none;">
      <div class="message bot-message">
        <svg class="bot-avatar" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 1024 1024">
          <path
            d="M738.3 287.6H285.7c-59 0-106.8 47.8-106.8 106.8v303.1c0 59 47.8 106.8 106.8 106.8h81.5v111.1c0 .7.8 1.1 1.4.7l166.9-110.6 41.8-.8h117.4l43.6-.4c59 0 106.8-47.8 106.8-106.8V394.5c0-59-47.8-106.9-106.8-106.9zM351.7 448.2c0-29.5 23.9-53.5 53.5-53.5s53.5 23.9 53.5 53.5-23.9 53.5-53.5 53.5-53.9-23.9-53.5-53.5zm157.9 267.1c-67.8 0-123.8-47.5-132.3-109h264.6c-8.6 61.5-64.5 109-132.3 109zm110-213.7c-29.5 0-53.5-23.9-53.5-53.5s23.9-53.5 53.5-53.5 53.5 23.9 53.5 53.5-23.9 53.5-53.5 53.5zM867.2 644.5V453.1h26.5c19.4 0 35.1 15.7 35.1 35.1v121.1c0 19.4-15.7 35.1-35.1 35.1h-26.5zM95.2 609.4V488.2c0-19.4 15.7-35.1 35.1-35.1h26.5v191.3h-26.5c-19.4 0-35.1-15.7-35.1-35.1zM561.5 149.6c0 23.4-15.6 43.3-36.9 49.7v44.9h-30v-44.9c-21.4-6.5-36.9-26.3-36.9-49.7 0-28.6 23.3-51.9 51.9-51.9s51.9 23.3 51.9 51.9z" />
        </svg>
        <!-- prettier-ignore -->
        <div class="message-text" id="welcome-message">Hey there! How can I help you today?</div>
      </div>
      <!-- Predefined Questions Cards -->
      <div class="predefined-questions" id="predefined-questions">
        <div class="pq-header">
          <span class="pq-header-icon">?</span>
          <span>Frequently Asked Questions</span>
        </div>
        <div class="pq-grid" id="pq-grid">
          <!-- Populated dynamically by chatbot.js -->
        </div>
      </div>
    </div>

    <!-- Chatbot Footer (shown after form submission) -->
    <div class="chat-footer" id="chat-footer" style="display: none;">
      <form action="#" class="chat-form">
        <textarea placeholder="Message..." class="message-input" required></textarea>
        <div class="chat-controls">
          <button type="button" id="emoji-picker" class="material-symbols-outlined">sentiment_satisfied</button>
          <div class="file-upload-wrapper">
            <input type="file" accept="image/*" id="file-input" hidden />
            <img src="#" alt="" />
            <button type="button" id="file-upload" class="material-symbols-rounded">attach_file</button>
            <button type="button" id="file-cancel" class="material-symbols-rounded">close</button>
          </div>
          <button type="submit" id="send-message" class="material-symbols-rounded">arrow_upward</button>
        </div>
      </form>
    </div>
  </div>
</div>
