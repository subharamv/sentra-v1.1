<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentra Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Sentra Admin</h2>
                <p>Dashboard Management</p>
            </div>
            <nav class="nav-menu" id="navMenu">
                <a class="nav-item" href="#/dashboard" data-page="dashboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    Overview
                </a>
                <a class="nav-item" href="#/leads" data-page="leads">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Contact Leads
                </a>
                <a class="nav-item" href="#/newsletter" data-page="newsletter">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    Newsletter
                </a>
                <a class="nav-item" href="#/brochures" data-page="brochures">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
                    Brochure Downloads
                </a>
                <a class="nav-item" href="#/chatbot" data-page="chatbot">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    Chatbot Leads
                </a>
                <a class="nav-item" href="#/chat" data-page="chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                    Live Chat
                </a>
                <a class="nav-item" href="#/accounts" data-page="accounts">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
                    Manage Accounts
                </a>
            </nav>
            <div class="sidebar-footer">
                <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;" id="whoami"></div>
                <a class="nav-item" href="#" id="logoutBtn" style="color: var(--danger); margin: 0;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Logout
                </a>
            </div>
        </aside>
        <main class="main-content" id="mainContent">
            <div class="loading"><div class="spinner"></div> Loading...</div>
        </main>
    </div>

    <div class="modal-overlay" id="statusModal">
        <div class="modal">
            <h3>Update Lead Status</h3>
            <select id="statusSelect">
                <option value="New">New</option>
                <option value="Contacted">Contacted</option>
                <option value="Qualified">Qualified</option>
                <option value="Closed">Closed</option>
            </select>
            <div class="modal-actions">
                <button class="btn btn-secondary" data-close-modal="statusModal">Cancel</button>
                <button class="btn btn-primary" id="saveStatusBtn">Save</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="accountModal">
        <div class="modal">
            <h3>Add Admin Account</h3>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="newAccountName" placeholder="Full name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="newAccountEmail" placeholder="name@sentratech.in">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="newAccountPassword" placeholder="Set a password">
            </div>
            <div class="form-group">
                <label>Role</label>
                <select id="newAccountRole">
                    <option value="Admin">Admin</option>
                    <option value="Super Admin">Super Admin</option>
                </select>
            </div>
            <div class="error-msg" id="accountErrorMsg"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" data-close-modal="accountModal">Cancel</button>
                <button class="btn btn-primary" id="saveAccountBtn">Create Account</button>
            </div>
        </div>
    </div>

    <script src="/js/dashboard.js"></script>
</body>
</html>
