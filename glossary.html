    <script type="application/ld+json">
    {
    "@context":"https://schema.org",
    "@type":"DefinedTermSet",
    "name":"Sentra Glossary — IoT & Structural Health Monitoring Terms",
    "description":"Comprehensive glossary of IoT, structural health monitoring, sensor technology, and digital twin terms used across Sentra's platform.",
    "url":"https://sentratech.in/glossary.html",
    "hasDefinedTerm":[
        {"@type":"DefinedTerm","name":"Accelerometer","description":"A sensor that measures acceleration forces, used to detect vibration, tilt, and motion in structural health monitoring."},
        {"@type":"DefinedTerm","name":"Actuator","description":"A device that converts electrical signals into physical motion, often used in control systems for valves, dampers, or mechanical positioning."},
        {"@type":"DefinedTerm","name":"ADC (Analog-to-Digital Converter)","description":"An electronic component that converts continuous analog signals from sensors into discrete digital values for processing."},
        {"@type":"DefinedTerm","name":"API (Application Programming Interface)","description":"A set of protocols and tools that allows different software applications to communicate and exchange data."},
        {"@type":"DefinedTerm","name":"Bandwidth","description":"The maximum rate of data transfer across a network path, critical for transmitting sensor data in real-time monitoring systems."},
        {"@type":"DefinedTerm","name":"Base Station","description":"A central hub that receives data from remote sensor nodes and relays it to a server or cloud platform for analysis."},
        {"@type":"DefinedTerm","name":"BIM (Building Information Modeling)","description":"A digital representation of a building's physical and functional characteristics, used for planning, design, and lifecycle management."},
        {"@type":"DefinedTerm","name":"Bridge Monitoring","description":"The continuous or periodic assessment of bridge structures using sensors to detect deformations, cracks, and load-induced stress."},
        {"@type":"DefinedTerm","name":"Calibration","description":"The process of adjusting sensor output to match a known standard, ensuring measurement accuracy and reliability."},
        {"@type":"DefinedTerm","name":"Cloud Computing","description":"On-demand delivery of computing power, storage, and applications over the internet, enabling scalable data processing and analytics."},
        {"@type":"DefinedTerm","name":"Corrosion Sensor","description":"A device that detects and measures corrosion rates in metal structures, providing early warning of material degradation."},
        {"@type":"DefinedTerm","name":"Crack Monitoring","description":"The measurement and tracking of crack width, depth, and propagation in structural elements to assess integrity."},
        {"@type":"DefinedTerm","name":"Dashboard","description":"A visual interface that displays real-time sensor data, alerts, and analytics in an easy-to-understand format."},
        {"@type":"DefinedTerm","name":"Data Acquisition (DAQ)","description":"The process of sampling signals from sensors and converting them into digital data for analysis and storage."},
        {"@type":"DefinedTerm","name":"Data Logger","description":"An electronic device that records sensor measurements over time, often with onboard memory for offline data collection."},
        {"@type":"DefinedTerm","name":"Digital Twin","description":"A virtual replica of a physical asset, system, or process that is updated with real-time data for simulation, monitoring, and optimization."},
        {"@type":"DefinedTerm","name":"Edge Computing","description":"Processing data near the source (sensor or device) rather than in the cloud, reducing latency and bandwidth usage."},
        {"@type":"DefinedTerm","name":"Energy Harvesting","description":"The capture and conversion of ambient energy (solar, vibration, thermal) into electrical power for low-energy sensors."},
        {"@type":"DefinedTerm","name":"Ethernet","description":"A wired networking technology commonly used to connect sensors, gateways, and controllers in industrial IoT deployments."},
        {"@type":"DefinedTerm","name":"Fiber Optic Sensor","description":"A sensor that uses optical fibers to measure strain, temperature, or pressure with high sensitivity and immunity to electromagnetic interference."},
        {"@type":"DefinedTerm","name":"Firmware","description":"Embedded software stored in a sensor or device's memory that controls its operation and communication protocols."},
        {"@type":"DefinedTerm","name":"FFT (Fast Fourier Transform)","description":"A mathematical algorithm that converts time-domain signals into frequency-domain data, used for vibration analysis."},
        {"@type":"DefinedTerm","name":"Gateway","description":"A device that bridges sensors and the cloud, translating communication protocols and aggregating data before transmission."},
        {"@type":"DefinedTerm","name":"Gaussian Splatting (3D Gaussian Splatting)","description":"A reality capture technique that represents a 3D scene as millions of tiny Gaussian primitives instead of points or polygons, enabling photorealistic, real-time-rendered digital twins from handheld SLAM scanners such as the XGRIDS Lixel K2 and PortalCam."},
        {"@type":"DefinedTerm","name":"GIS (Geographic Information System)","description":"A system for capturing, storing, and analyzing spatial and geographic data, often layered with infrastructure monitoring data."},
        {"@type":"DefinedTerm","name":"GNSS (Global Navigation Satellite System)","description":"A constellation of satellites providing positioning and timing data, used for deformation monitoring and structural displacement tracking."},
        {"@type":"DefinedTerm","name":"GPS (Global Positioning System)","description":"A satellite-based navigation system that provides location and time information, commonly used in asset tracking and structural surveys."},
        {"@type":"DefinedTerm","name":"IIoT (Industrial Internet of Things)","description":"A network of connected industrial devices, sensors, and machinery that collect and exchange data for automation and optimization."},
        {"@type":"DefinedTerm","name":"Inclinometer","description":"A sensor that measures slope, tilt, or angular displacement relative to gravity, used in landslide and structural monitoring."},
        {"@type":"DefinedTerm","name":"Infrastructure Monitoring","description":"The systematic observation of civil infrastructure assets using sensors to assess condition, performance, and safety."},
        {"@type":"DefinedTerm","name":"IoT (Internet of Things)","description":"A network of physical devices embedded with sensors and connectivity that collect and exchange data over the internet."},
        {"@type":"DefinedTerm","name":"JSON (JavaScript Object Notation)","description":"A lightweight data-interchange format commonly used for transmitting sensor data between devices and cloud platforms."},
        {"@type":"DefinedTerm","name":"Latency","description":"The time delay between data transmission and reception, a critical factor in real-time monitoring and control systems."},
        {"@type":"DefinedTerm","name":"LiDAR (Light Detection and Ranging)","description":"A remote sensing technology that measures distance by pulsing laser light and timing its reflection, used in handheld and vehicle-mounted scanners to capture survey-grade 3D point clouds."},
        {"@type":"DefinedTerm","name":"LVDT (Linear Variable Differential Transformer)","description":"An electromechanical sensor that measures linear displacement with high precision, used in structural testing."},
        {"@type":"DefinedTerm","name":"MEMS (Micro-Electromechanical Systems)","description":"Miniaturized mechanical and electromechanical elements fabricated on silicon wafers, used in compact accelerometers and gyroscopes."},
        {"@type":"DefinedTerm","name":"Mesh (3D Reconstruction)","description":"A 3D model built from connected polygons (usually triangles) that converts a raw point cloud into continuous surfaces, used for visualization, rendering, and simulation."},
        {"@type":"DefinedTerm","name":"Mesh Network","description":"A network topology where each node relays data for others, extending range and reliability in large sensor deployments."},
        {"@type":"DefinedTerm","name":"Modbus","description":"A serial communication protocol widely used in industrial automation and SCADA systems for connecting sensors and controllers."},
        {"@type":"DefinedTerm","name":"MQTT (Message Queuing Telemetry Transport)","description":"A lightweight publish-subscribe messaging protocol optimized for low-bandwidth, high-latency IoT networks."},
        {"@type":"DefinedTerm","name":"Noise (Signal)","description":"Unwanted random variations in a sensor signal that can obscure the measured quantity; often reduced by filtering and averaging."},
        {"@type":"DefinedTerm","name":"Nyquist Theorem","description":"A sampling principle stating that a signal must be sampled at least twice its highest frequency to avoid aliasing."},
        {"@type":"DefinedTerm","name":"Photogrammetry","description":"A reality capture technique that reconstructs 3D geometry and texture from overlapping photographs, often used alongside or as an alternative to LiDAR scanning."},
        {"@type":"DefinedTerm","name":"Piezoelectric Sensor","description":"A sensor that generates an electrical charge in response to mechanical stress, commonly used for vibration and pressure measurement."},
        {"@type":"DefinedTerm","name":"Point Cloud","description":"A dataset of millions of XYZ coordinate points, often with RGB colour and intensity values, captured by a laser scanner or LiDAR sensor to represent the precise geometry of a physical space."},
        {"@type":"DefinedTerm","name":"Predictive Maintenance","description":"A maintenance strategy that uses sensor data and analytics to predict equipment failures before they occur, reducing downtime."},
        {"@type":"DefinedTerm","name":"Protocol","description":"A set of rules governing data format and communication between devices, such as MQTT, Modbus, or HTTP."},
        {"@type":"DefinedTerm","name":"Reality Capture","description":"The process of digitally recording a physical environment as a point cloud, mesh, or Gaussian Splat using laser scanners, LiDAR, or photogrammetry — the foundation of every Digital Twin."},
        {"@type":"DefinedTerm","name":"RTK (Real-Time Kinematic Positioning)","description":"A satellite navigation technique that delivers centimetre-level positioning accuracy, used in handheld SLAM scanners and GNSS survey equipment to georeference captured data without ground control points."},
        {"@type":"DefinedTerm","name":"RTU (Remote Terminal Unit)","description":"A microprocessor-controlled device that interfaces sensors with a SCADA system, often used in remote monitoring."},
        {"@type":"DefinedTerm","name":"Sampling Rate","description":"The frequency at which a sensor's analog signal is converted to digital values, measured in samples per second (Hz)."},
        {"@type":"DefinedTerm","name":"SCADA (Supervisory Control and Data Acquisition)","description":"A control system architecture that monitors and controls industrial processes using remote sensors and centralized software."},
        {"@type":"DefinedTerm","name":"Scan-to-BIM","description":"The workflow of converting a laser-scanned point cloud into a semantically rich, IFC-compliant BIM model with classified elements and metadata."},
        {"@type":"DefinedTerm","name":"Sensor Fusion","description":"The combination of data from multiple sensor types to produce more accurate, reliable, and comprehensive measurements."},
        {"@type":"DefinedTerm","name":"SHM (Structural Health Monitoring)","description":"The process of using sensors to continuously or periodically assess the condition and performance of civil infrastructure."},
        {"@type":"DefinedTerm","name":"Signal Conditioning","description":"The processing of raw sensor signals through amplification, filtering, and conversion to improve quality before digitization."},
        {"@type":"DefinedTerm","name":"SLAM (Simultaneous Localization and Mapping)","description":"An algorithm that lets a handheld or mobile scanner build a map of an unknown environment while simultaneously tracking its own position within it, enabling tripod-free, walk-and-scan reality capture."},
        {"@type":"DefinedTerm","name":"Smart City","description":"An urban area that uses IoT sensors and data analytics to improve infrastructure efficiency, sustainability, and quality of life."},
        {"@type":"DefinedTerm","name":"Spatial Camera","description":"A handheld reality capture device that fuses LiDAR depth, an RGB camera array, and onboard AI to reconstruct photorealistic, walkable 3D environments — such as the XGRIDS PortalCam."},
        {"@type":"DefinedTerm","name":"Strain Gauge","description":"A sensor that measures strain (deformation) in a material by detecting changes in electrical resistance."},
        {"@type":"DefinedTerm","name":"Telemetry","description":"The automated transmission of sensor data from remote locations to a central system for monitoring and analysis."},
        {"@type":"DefinedTerm","name":"Thermocouple","description":"A temperature sensor consisting of two dissimilar metals that produces a voltage proportional to temperature difference."},
        {"@type":"DefinedTerm","name":"Tiltmeter","description":"A precision instrument that measures angular tilt or rotation, used in dam, tunnel, and slope stability monitoring."},
        {"@type":"DefinedTerm","name":"UDP (User Datagram Protocol)","description":"A connectionless network protocol used for low-latency data transmission where occasional packet loss is acceptable."},
        {"@type":"DefinedTerm","name":"Ultrasonic Sensor","description":"A sensor that uses high-frequency sound waves to measure distance, level, or material thickness."},
        {"@type":"DefinedTerm","name":"Vibration Analysis","description":"The study of vibration patterns in machinery or structures to detect imbalances, misalignments, or developing faults."},
        {"@type":"DefinedTerm","name":"VPN (Virtual Private Network)","description":"A secure encrypted tunnel over a public network, used to protect sensor data transmitted between remote sites and the cloud."},
        {"@type":"DefinedTerm","name":"Webhook","description":"An HTTP callback that sends real-time data or alerts from a server to another application when specific events occur."},
        {"@type":"DefinedTerm","name":"Wi-Fi","description":"A wireless networking technology that uses radio waves to connect devices to a local area network and the internet."},
        {"@type":"DefinedTerm","name":"Wireless Sensor Network (WSN)","description":"A group of spatially distributed wireless sensors that cooperatively monitor physical or environmental conditions."},
        {"@type":"DefinedTerm","name":"XML (eXtensible Markup Language)","description":"A markup language for encoding data in a human-readable format, used in some legacy SCADA and IoT systems."}
    ]
    }

        .glossary-group:first-child .glossary-letter-heading {
            padding-top: 0;
        }

        .glossary-term {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: background 0.2s ease;
            border-radius: 8px;
            text-align: left;
            width: 100%;
            background: transparent;
            border-left: none; border-right: none; border-top: none;
            color: inherit; font: inherit;
        }
        .glossary-term:hover { background: rgba(255,255,255,0.03); }
        .glossary-term:last-child { border-bottom: none; }
        body.lightmode .glossary-term { border-bottom-color: rgba(0,0,0,0.05); }
        body.lightmode .glossary-term:hover { background: rgba(0,0,0,0.02); }

        .glossary-term-content { flex: 1; min-width: 0; }
        .glossary-term-name {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--accent-color);
            transition: color 0.2s ease;
        }
        .glossary-term:hover .glossary-term-name { color: #ff9a4a; }
        .glossary-term-badge {
            display: inline-block;
            margin-left: 8px;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.35);
            font-weight: 500;
            vertical-align: middle;
            letter-spacing: 0.3px;
        }
        body.lightmode .glossary-term-badge {
            background: rgba(0,0,0,0.05);
            color: rgba(0,0,0,0.35);
        }

        .glossary-term-def {
            overflow: hidden;
            transition: all 0.3s ease;
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }
        .glossary-term-def.expanded {
            max-height: 200px;
            opacity: 1;
            margin-top: 6px;
        }
        .glossary-term-def p {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.45);
            line-height: 1.6;
            margin: 0;
        }
        body.lightmode .glossary-term-def p { color: rgba(0,0,0,0.45); }

        .glossary-term-chevron {
            flex-shrink: 0;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.2);
            transition: transform 0.3s ease, color 0.2s ease;
            margin-top: 4px;
        }
        .glossary-term:hover .glossary-term-chevron { color: rgba(255,255,255,0.4); }
        .glossary-term-chevron.open { transform: rotate(180deg); }
        body.lightmode .glossary-term-chevron { color: rgba(0,0,0,0.2); }
        body.lightmode .glossary-term:hover .glossary-term-chevron { color: rgba(0,0,0,0.4); }

        .glossary-empty { display: none; text-align: center; padding: 4rem 0; }
        .glossary-empty.visible { display: block; }
        .glossary-empty p { font-size: 1rem; opacity: 0.4; margin: 0; }

        @media (min-width: 1024px) {
            .glossary-hero { padding: 130px 24px 70px; }
            .glossary-layout { padding-left: 80px; }
            .glossary-sidebar { left: 24px; width: 40px; }
            .glossary-sidebar-inner { gap: 2px; padding: 6px 4px; border-radius: 14px; }
            .glossary-sidebar a { width: 30px; height: 28px; font-size: 0.7rem; }
        }
    </style>
</head>

<body>

    <script>
        var glossaryData = [
            { term: "Accelerometer", cat: "Sensors", def: "A sensor that measures acceleration forces, used to detect vibration, tilt, and motion in structural health monitoring." },
            { term: "Actuator", cat: "Sensors", def: "A device that converts electrical signals into physical motion, often used in control systems for valves, dampers, or mechanical positioning." },
            { term: "ADC (Analog-to-Digital Converter)", cat: "Hardware", def: "An electronic component that converts continuous analog signals from sensors into discrete digital values for processing." },
            { term: "API (Application Programming Interface)", cat: "Platform", def: "A set of protocols and tools that allows different software applications to communicate and exchange data." },
            { term: "Bandwidth", cat: "Networking", def: "The maximum rate of data transfer across a network path, critical for transmitting sensor data in real-time monitoring systems." },
            { term: "Base Station", cat: "Hardware", def: "A central hub that receives data from remote sensor nodes and relays it to a server or cloud platform for analysis." },
            { term: "BIM (Building Information Modeling)", cat: "Concepts", def: "A digital representation of a building's physical and functional characteristics, used for planning, design, and lifecycle management." },
            { term: "Bridge Monitoring", cat: "Monitoring", def: "The continuous or periodic assessment of bridge structures using sensors to detect deformations, cracks, and load-induced stress." },
            { term: "Calibration", cat: "Procedures", def: "The process of adjusting sensor output to match a known standard, ensuring measurement accuracy and reliability." },
            { term: "Cloud Computing", cat: "Platform", def: "On-demand delivery of computing power, storage, and applications over the internet, enabling scalable data processing and analytics." },
            { term: "Corrosion Sensor", cat: "Sensors", def: "A device that detects and measures corrosion rates in metal structures, providing early warning of material degradation." },
            { term: "Crack Monitoring", cat: "Monitoring", def: "The measurement and tracking of crack width, depth, and propagation in structural elements to assess integrity." },
            { term: "Dashboard", cat: "Platform", def: "A visual interface that displays real-time sensor data, alerts, and analytics in an easy-to-understand format." },
            { term: "Data Acquisition (DAQ)", cat: "Hardware", def: "The process of sampling signals from sensors and converting them into digital data for analysis and storage." },
            { term: "Data Logger", cat: "Hardware", def: "An electronic device that records sensor measurements over time, often with onboard memory for offline data collection." },
            { term: "Digital Twin", cat: "Concepts", def: "A virtual replica of a physical asset, system, or process that is updated with real-time data for simulation, monitoring, and optimization." },
            { term: "Edge Computing", cat: "Platform", def: "Processing data near the source (sensor or device) rather than in the cloud, reducing latency and bandwidth usage." },
            { term: "Energy Harvesting", cat: "Hardware", def: "The capture and conversion of ambient energy (solar, vibration, thermal) into electrical power for low-energy sensors." },
            { term: "Ethernet", cat: "Networking", def: "A wired networking technology commonly used to connect sensors, gateways, and controllers in industrial IoT deployments." },
            { term: "Fiber Optic Sensor", cat: "Sensors", def: "A sensor that uses optical fibers to measure strain, temperature, or pressure with high sensitivity and immunity to electromagnetic interference." },
            { term: "Firmware", cat: "Platform", def: "Embedded software stored in a sensor or device's memory that controls its operation and communication protocols." },
            { term: "FFT (Fast Fourier Transform)", cat: "Analysis", def: "A mathematical algorithm that converts time-domain signals into frequency-domain data, used for vibration analysis." },
            { term: "Gateway", cat: "Hardware", def: "A device that bridges sensors and the cloud, translating communication protocols and aggregating data before transmission." },
            { term: "Gaussian Splatting (3D Gaussian Splatting)", cat: "Reality Capture", def: "A reality capture technique that represents a 3D scene as millions of tiny Gaussian primitives instead of points or polygons, enabling photorealistic, real-time-rendered digital twins from handheld SLAM scanners such as the XGRIDS Lixel K2 and PortalCam." },
            { term: "GIS (Geographic Information System)", cat: "Concepts", def: "A system for capturing, storing, and analyzing spatial and geographic data, often layered with infrastructure monitoring data." },
            { term: "GNSS (Global Navigation Satellite System)", cat: "Hardware", def: "A constellation of satellites providing positioning and timing data, used for deformation monitoring and structural displacement tracking." },
            { term: "GPS (Global Positioning System)", cat: "Hardware", def: "A satellite-based navigation system that provides location and time information, commonly used in asset tracking and structural surveys." },
            { term: "IIoT (Industrial Internet of Things)", cat: "Concepts", def: "A network of connected industrial devices, sensors, and machinery that collect and exchange data for automation and optimization." },
            { term: "Inclinometer", cat: "Sensors", def: "A sensor that measures slope, tilt, or angular displacement relative to gravity, used in landslide and structural monitoring." },
            { term: "Infrastructure Monitoring", cat: "Monitoring", def: "The systematic observation of civil infrastructure assets using sensors to assess condition, performance, and safety." },
            { term: "IoT (Internet of Things)", cat: "Concepts", def: "A network of physical devices embedded with sensors and connectivity that collect and exchange data over the internet." },
            { term: "JSON (JavaScript Object Notation)", cat: "Formats", def: "A lightweight data-interchange format commonly used for transmitting sensor data between devices and cloud platforms." },
            { term: "Latency", cat: "Networking", def: "The time delay between data transmission and reception, a critical factor in real-time monitoring and control systems." },
            { term: "LiDAR (Light Detection and Ranging)", cat: "Reality Capture", def: "A remote sensing technology that measures distance by pulsing laser light and timing its reflection, used in handheld and vehicle-mounted scanners to capture survey-grade 3D point clouds." },
            { term: "LVDT (Linear Variable Differential Transformer)", cat: "Sensors", def: "An electromechanical sensor that measures linear displacement with high precision, used in structural testing." },
            { term: "MEMS (Micro-Electromechanical Systems)", cat: "Hardware", def: "Miniaturized mechanical and electromechanical elements fabricated on silicon wafers, used in compact accelerometers and gyroscopes." },
            { term: "Mesh (3D Reconstruction)", cat: "Reality Capture", def: "A 3D model built from connected polygons (usually triangles) that converts a raw point cloud into continuous surfaces, used for visualization, rendering, and simulation." },
            { term: "Mesh Network", cat: "Networking", def: "A network topology where each node relays data for others, extending range and reliability in large sensor deployments." },
            { term: "Modbus", cat: "Protocols", def: "A serial communication protocol widely used in industrial automation and SCADA systems for connecting sensors and controllers." },
            { term: "MQTT (Message Queuing Telemetry Transport)", cat: "Protocols", def: "A lightweight publish-subscribe messaging protocol optimized for low-bandwidth, high-latency IoT networks." },
            { term: "Noise (Signal)", cat: "Concepts", def: "Unwanted random variations in a sensor signal that can obscure the measured quantity; often reduced by filtering and averaging." },
            { term: "Nyquist Theorem", cat: "Concepts", def: "A sampling principle stating that a signal must be sampled at least twice its highest frequency to avoid aliasing." },
            { term: "Photogrammetry", cat: "Reality Capture", def: "A reality capture technique that reconstructs 3D geometry and texture from overlapping photographs, often used alongside or as an alternative to LiDAR scanning." },
            { term: "Piezoelectric Sensor", cat: "Sensors", def: "A sensor that generates an electrical charge in response to mechanical stress, commonly used for vibration and pressure measurement." },
            { term: "Point Cloud", cat: "Reality Capture", def: "A dataset of millions of XYZ coordinate points, often with RGB colour and intensity values, captured by a laser scanner or LiDAR sensor to represent the precise geometry of a physical space." },
            { term: "Predictive Maintenance", cat: "Concepts", def: "A maintenance strategy that uses sensor data and analytics to predict equipment failures before they occur, reducing downtime." },
            { term: "Protocol", cat: "Protocols", def: "A set of rules governing data format and communication between devices, such as MQTT, Modbus, or HTTP." },
            { term: "Reality Capture", cat: "Reality Capture", def: "The process of digitally recording a physical environment as a point cloud, mesh, or Gaussian Splat using laser scanners, LiDAR, or photogrammetry — the foundation of every Digital Twin." },
            { term: "RTK (Real-Time Kinematic Positioning)", cat: "Reality Capture", def: "A satellite navigation technique that delivers centimetre-level positioning accuracy, used in handheld SLAM scanners and GNSS survey equipment to georeference captured data without ground control points." },
            { term: "RTU (Remote Terminal Unit)", cat: "Hardware", def: "A microprocessor-controlled device that interfaces sensors with a SCADA system, often used in remote monitoring." },
            { term: "Sampling Rate", cat: "Concepts", def: "The frequency at which a sensor's analog signal is converted to digital values, measured in samples per second (Hz)." },
            { term: "SCADA (Supervisory Control and Data Acquisition)", cat: "Platform", def: "A control system architecture that monitors and controls industrial processes using remote sensors and centralized software." },
            { term: "Scan-to-BIM", cat: "Reality Capture", def: "The workflow of converting a laser-scanned point cloud into a semantically rich, IFC-compliant BIM model with classified elements and metadata." },
            { term: "Sensor Fusion", cat: "Concepts", def: "The combination of data from multiple sensor types to produce more accurate, reliable, and comprehensive measurements." },
            { term: "SHM (Structural Health Monitoring)", cat: "Monitoring", def: "The process of using sensors to continuously or periodically assess the condition and performance of civil infrastructure." },
            { term: "Signal Conditioning", cat: "Hardware", def: "The processing of raw sensor signals through amplification, filtering, and conversion to improve quality before digitization." },
            { term: "SLAM (Simultaneous Localization and Mapping)", cat: "Reality Capture", def: "An algorithm that lets a handheld or mobile scanner build a map of an unknown environment while simultaneously tracking its own position within it, enabling tripod-free, walk-and-scan reality capture." },
            { term: "Smart City", cat: "Concepts", def: "An urban area that uses IoT sensors and data analytics to improve infrastructure efficiency, sustainability, and quality of life." },
            { term: "Spatial Camera", cat: "Reality Capture", def: "A handheld reality capture device that fuses LiDAR depth, an RGB camera array, and onboard AI to reconstruct photorealistic, walkable 3D environments — such as the XGRIDS PortalCam." },
            { term: "Strain Gauge", cat: "Sensors", def: "A sensor that measures strain (deformation) in a material by detecting changes in electrical resistance." },
            { term: "Telemetry", cat: "Networking", def: "The automated transmission of sensor data from remote locations to a central system for monitoring and analysis." },
            { term: "Thermocouple", cat: "Sensors", def: "A temperature sensor consisting of two dissimilar metals that produces a voltage proportional to temperature difference." },
            { term: "Tiltmeter", cat: "Sensors", def: "A precision instrument that measures angular tilt or rotation, used in dam, tunnel, and slope stability monitoring." },
            { term: "UDP (User Datagram Protocol)", cat: "Protocols", def: "A connectionless network protocol used for low-latency data transmission where occasional packet loss is acceptable." },
            { term: "Ultrasonic Sensor", cat: "Sensors", def: "A sensor that uses high-frequency sound waves to measure distance, level, or material thickness." },
            { term: "Vibration Analysis", cat: "Analysis", def: "The study of vibration patterns in machinery or structures to detect imbalances, misalignments, or developing faults." },
            { term: "VPN (Virtual Private Network)", cat: "Networking", def: "A secure encrypted tunnel over a public network, used to protect sensor data transmitted between remote sites and the cloud." },
            { term: "Webhook", cat: "Platform", def: "An HTTP callback that sends real-time data or alerts from a server to another application when specific events occur." },
            { term: "Wi-Fi", cat: "Networking", def: "A wireless networking technology that uses radio waves to connect devices to a local area network and the internet." },
            { term: "Wireless Sensor Network (WSN)", cat: "Networking", def: "A group of spatially distributed wireless sensors that cooperatively monitor physical or environmental conditions." },
            { term: "XML (eXtensible Markup Language)", cat: "Formats", def: "A markup language for encoding data in a human-readable format, used in some legacy SCADA and IoT systems." }
        ];

        var grouped = {};
        var letters = [];

        function buildGlossary() {
            grouped = {};
            glossaryData.forEach(function (item) {
                var letter = item.term.charAt(0).toUpperCase();
                if (!grouped[letter]) grouped[letter] = [];
                grouped[letter].push(item);
            });

            letters = Object.keys(grouped).sort();

            var jumpHtml = letters.map(function (l) {
                return '<a href="#gloss-' + l + '">' + l + '</a>';
            }).join('');
            document.getElementById('glossaryJumpMobile').innerHTML = jumpHtml;

            var sidebarHtml = letters.map(function (l) {
                return '<a href="#gloss-' + l + '" data-letter="' + l + '">' + l + '</a>';
            }).join('');
            document.getElementById('glossarySidebarInner').innerHTML = sidebarHtml;

            var groupsHtml = letters.map(function (l) {
                var html = '<div class="glossary-group" id="gloss-' + l + '">';
                html += '<div class="glossary-letter-heading">' + l + '</div>';
                grouped[l].forEach(function (item) {
                    var safeTerm = item.term.replace(/'/g, '\\x27');
                    var safeDef = item.def.replace(/'/g, '\\x27');
                    html += '<button class="glossary-term" data-term="' + item.term.toLowerCase() + '" data-def="' + item.def.toLowerCase() + '" data-cat="' + item.cat.toLowerCase() + '" onclick="toggleDef(this)">';
                    html += '<div class="glossary-term-content">';
                    html += '<span class="glossary-term-name">' + item.term + '</span>';
                    html += '<span class="glossary-term-badge">' + item.cat + '</span>';
                    html += '<div class="glossary-term-def"><p>' + item.def + '</p></div>';
                    html += '</div>';
                    html += '<span class="glossary-term-chevron"><span class="material-symbols-rounded" style="font-size:14px">expand_more</span></span>';
                    html += '</button>';
                });
                html += '</div>';
                return html;
            }).join('');
            document.getElementById('glossaryGroups').innerHTML = groupsHtml;
        }

        function toggleDef(el) {
            var def = el.querySelector('.glossary-term-def');
            var chevron = el.querySelector('.glossary-term-chevron');
            var expanded = def.classList.contains('expanded');
            document.querySelectorAll('.glossary-term-def.expanded').forEach(function (d) { d.classList.remove('expanded'); });
            document.querySelectorAll('.glossary-term-chevron.open').forEach(function (c) { c.classList.remove('open'); });
            if (!expanded) {
                def.classList.add('expanded');
                chevron.classList.add('open');
            }
        }

        function filterGlossary() {
            var input = document.getElementById('glossarySearch');
            var query = input.value.trim().toLowerCase();
            var activeCat = document.querySelector('.glossary-filter-btn.active');
            var cat = activeCat ? activeCat.getAttribute('data-cat') : '';
            var terms = document.querySelectorAll('.glossary-term');
            var anyVisible = false;
            terms.forEach(function (el) {
                var textMatch = query === '' || el.getAttribute('data-term').indexOf(query) !== -1 || el.getAttribute('data-def').indexOf(query) !== -1;
                var catMatch = cat === '' || el.getAttribute('data-cat') === cat;
                var match = textMatch && catMatch;
                el.style.display = match ? '' : 'none';
                if (match) anyVisible = true;
                if (!match) {
                    var def = el.querySelector('.glossary-term-def');
                    var chevron = el.querySelector('.glossary-term-chevron');
                    if (def) def.classList.remove('expanded');
                    if (chevron) chevron.classList.remove('open');
                }
            });
            var groups = document.querySelectorAll('.glossary-group');
            groups.forEach(function (g) {
                var has = Array.from(g.querySelectorAll('.glossary-term')).some(function (t) { return t.style.display !== 'none'; });
                g.style.display = has ? '' : 'none';
            });
            document.getElementById('glossaryEmpty').classList.toggle('visible', !anyVisible);
            document.getElementById('glossarySearchClear').classList.toggle('visible', query.length > 0);
        }

        function buildFilters() {
            var cats = {};
            glossaryData.forEach(function (item) { cats[item.cat] = true; });
            var list = Object.keys(cats).sort();
            var html = '<button class="glossary-filter-btn active" data-cat="">All</button>';
            list.forEach(function (c) {
                html += '<button class="glossary-filter-btn" data-cat="' + c.toLowerCase() + '">' + c + '</button>';
            });
            document.getElementById('glossaryFilters').innerHTML = html;
            document.querySelectorAll('.glossary-filter-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    document.querySelectorAll('.glossary-filter-btn').forEach(function (b) { b.classList.remove('active'); });
                    this.classList.add('active');
                    filterGlossary();
                });
            });
        }

        function initScrollSpy() {
            if (typeof IntersectionObserver === 'undefined') return;
            var sidebarLinks = document.querySelectorAll('.glossary-sidebar a');
            var letterHeadings = document.querySelectorAll('.glossary-letter-heading');
            if (!letterHeadings.length) return;

            var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        var id = entry.target.closest('.glossary-group').id;
                        var letter = id.replace('gloss-', '');
                        sidebarLinks.forEach(function (link) {
                            link.classList.toggle('active', link.getAttribute('data-letter') === letter);
                        });
                    }
                });
            }, { rootMargin: '-20% 0px -70% 0px' });

            letterHeadings.forEach(function (h) {
                observer.observe(h);
            });
        }

        buildGlossary();
        buildFilters();
        initScrollSpy();

        document.getElementById('glossarySearch').addEventListener('input', filterGlossary);
        document.getElementById('glossarySearchClear').addEventListener('click', function () {
            var inp = document.getElementById('glossarySearch');
            inp.value = '';
            filterGlossary();
            inp.focus();
        });
    </script>
